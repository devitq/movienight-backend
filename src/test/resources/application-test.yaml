spring:
  application:
    name: MovieNight-Test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

services:
  user:
    blocked-names:
      - admin
      - root
      - system
  film:
    blocked-patterns:
      - censored
      - epstein
      - python

integrations:
  jellyfin:
    web-url: https://jellyfin.example.test
